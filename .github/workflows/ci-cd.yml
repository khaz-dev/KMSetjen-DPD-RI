name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ==============================================================================
  # Frontend Tests
  # ==============================================================================
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      working-directory: frontend
      run: npm ci --legacy-peer-deps
    
    - name: Run linter
      working-directory: frontend
      run: npm run lint --if-present || true
    
    - name: Run tests
      working-directory: frontend
      run: npm test -- --watchAll=false --coverage --passWithNoTests
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./frontend/coverage/lcov.info
        flags: frontend
        name: frontend-coverage

  # ==============================================================================
  # Backend Tests
  # ==============================================================================
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: kmsdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Okkdpdri@2026
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6382:6382
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt
    
    - name: Install dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov
    
    - name: Run model tests
      working-directory: backend
      env:
        DATABASE_URL: postgresql://postgres:Okkdpdri@2026@localhost:5432/kmsdb
      run: pytest tests/models/ -v --cov=apps --cov-report=xml
    
    - name: Run security tests
      working-directory: backend
      env:
        DATABASE_URL: postgresql://postgres:Okkdpdri@2026@localhost:5432/kmsdb
      run: pytest tests/security/ -v
    
    - name: Run API tests
      working-directory: backend
      env:
        DATABASE_URL: postgresql://postgres:Okkdpdri@2026@localhost:5432/kmsdb
      run: pytest tests/api/ -v --cov=apps --cov-report=xml --cov-append
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./backend/coverage.xml
        flags: backend
        name: backend-coverage

  # ==============================================================================
  # Code Quality & Security
  # ==============================================================================
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 black pylint bandit
    
    - name: Run Black formatter check
      working-directory: backend
      run: black --check . || true
    
    - name: Run Flake8 linter
      working-directory: backend
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
    
    - name: Run Bandit security check
      working-directory: backend
      run: bandit -r apps/ -f json -o bandit-report.json || true

  # ==============================================================================
  # Docker Build
  # ==============================================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [ frontend-tests, backend-tests ]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image (Django)
      working-directory: backend
      run: docker build -t kms-django:latest .
    
    - name: Build Docker Compose stack
      run: docker-compose config > /dev/null  # Validate docker-compose.yml

  # ==============================================================================
  # Deploy to Staging (Optional)
  # ==============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [ frontend-tests, backend-tests, docker-build ]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to staging server
      env:
        DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
        DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
      run: |
        mkdir -p ~/.ssh
        echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
        echo "Deployment would run here"

  # ==============================================================================
  # Deploy to Production (Optional)
  # ==============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [ frontend-tests, backend-tests, docker-build ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to production server
      env:
        DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY }}
        DEPLOY_HOST: ${{ secrets.PROD_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.PROD_DEPLOY_USER }}
      run: |
        mkdir -p ~/.ssh
        echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
        echo "Production deployment would run here"
