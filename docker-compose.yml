version: '3.8'

services:
  # ==============================================================================
  # PostgreSQL Database
  # ==============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: kms_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-kms_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kms_network
    restart: unless-stopped

  # ==============================================================================
  # Redis Cache & Session Store
  # ==============================================================================
  redis:
    image: redis:7-alpine
    container_name: kms_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kms_network
    restart: unless-stopped

  # ==============================================================================
  # Django Application
  # ==============================================================================
  django:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kms_django
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Django Settings
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,django}
      
      # Database Configuration
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-kms_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: postgres
      DB_PORT: 5432
      
      # Redis Configuration
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/2
      
      # CORS & Security
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-localhost,127.0.0.1}
      
      # Email Configuration
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      
      # JWT
      JWT_ACCESS_TOKEN_LIFETIME_HOURS: 1
      JWT_REFRESH_TOKEN_LIFETIME_DAYS: 7
      
      # Logging
      LOG_LEVEL: INFO
    volumes:
      - ./backend:/app
      - django_static:/app/staticfiles
      - django_media:/app/media
      - django_logs:/app/logs
    ports:
      - "8000:8000"
    networks:
      - kms_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==============================================================================
  # Frontend (Optional - for full-stack deployment)
  # ==============================================================================
  # Uncomment this section if you want to run frontend in Docker
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: kms_frontend
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - django
  #   environment:
  #     REACT_APP_API_URL: http://django:8000
  #   networks:
  #     - kms_network
  #   restart: unless-stopped

  # ==============================================================================
  # Nginx Reverse Proxy (Optional - for production)
  # ==============================================================================
  # Uncomment this section for production-grade reverse proxy
  # nginx:
  #   image: nginx:alpine
  #   container_name: kms_nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #     - django_static:/app/staticfiles:ro
  #     - django_media:/app/media:ro
  #   depends_on:
  #     - django
  #   networks:
  #     - kms_network
  #   restart: unless-stopped

# ==============================================================================
# Volumes for persistent data
# ==============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  django_static:
    driver: local
  django_media:
    driver: local
  django_logs:
    driver: local

# ==============================================================================
# Networks
# ==============================================================================
networks:
  kms_network:
    driver: bridge
