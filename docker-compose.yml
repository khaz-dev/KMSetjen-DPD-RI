services:
  # ==============================================================================
  # PostgreSQL Database - Running on local machine (not Docker)
  # Configuration for local PostgreSQL:
  # - Host: localhost
  # - Port: 5432
  # - Database: kmsdb
  # - User: postgres
  # - Password: Okkdpdri@2026
  # ==============================================================================

  # ==============================================================================
  # Redis Cache & Session Store
  # ==============================================================================
  redis:
    image: redis:7-alpine
    container_name: kms_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    ports:
      - "6382:6382"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kms_network
    restart: unless-stopped

  # ==============================================================================
  # Django Application
  # ==============================================================================
  django:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kms_django
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
    environment:
      # Override only database host to use Docker networking
      DB_HOST: host.docker.internal
      # Override Redis host to use Docker service name
      REDIS_HOST: redis
      REDIS_PORT: "6382"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6382/0
      CACHE_LOCATION: redis://:${REDIS_PASSWORD}@redis:6382/1
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6382/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6382/2
      ENABLE_CAPTCHA: ${ENABLE_CAPTCHA:-True}

      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-2621440}
      ALLOWED_FILE_EXTENSIONS: ${ALLOWED_FILE_EXTENSIONS:-.jpg,.jpeg,.png,.pdf,.docx,.xlsx}
      
      # Logging
      LOG_LEVEL: INFO
      LOG_FILE_PATH: /app/logs/django.log
    volumes:
      - ./backend:/app
      - kms_django_static:/app/staticfiles
      - kms_django_media:/app/media
      - kms_django_logs:/app/logs
    ports:
      - "8002:8002"
    networks:
      - kms_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==============================================================================
  # Frontend (React Application - Vite)
  # ==============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Pass build arguments from .env to Docker build
        # IMPORTANT: defaults should match staging/production, not localhost!
        # Staging default: /kms, Production default: depends on deploy, Local default: /
        VITE_APP_SUBPATH: ${VITE_APP_SUBPATH:-/kms}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://django:8002/api}
        VITE_API_URL: ${VITE_API_URL:-http://django:8002}
        VITE_API_TIMEOUT: ${VITE_API_TIMEOUT:-10000}
        FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5175}
        VITE_SSO_URL: ${VITE_SSO_URL:-https://nusadpd.duckdns.org}
        VITE_SSO_CLIENT_ID: ${VITE_SSO_CLIENT_ID:-KMS}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_GOOGLE_REDIRECT_URI: ${VITE_GOOGLE_REDIRECT_URI:-http://localhost:5175/google/callback/}
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:-}
    container_name: kms_frontend
    ports:
      - "5175:5175"
    depends_on:
      - django
    env_file: .env
    environment:
      # API configuration for docker environment
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://django:8002/api}
      VITE_API_URL: ${VITE_API_URL:-http://django:8002}
      VITE_API_TIMEOUT: ${VITE_API_TIMEOUT:-10000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5175}
      
      # SSO Configuration
      VITE_SSO_URL: ${VITE_SSO_URL:-https://nusadpd.duckdns.org}
      VITE_SSO_CLIENT_ID: ${VITE_SSO_CLIENT_ID:-KMS}
      
      # Google OAuth
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
      VITE_GOOGLE_REDIRECT_URI: ${VITE_GOOGLE_REDIRECT_URI:-http://localhost:5175/google/callback/}
      
      # reCAPTCHA
      VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:-}
    networks:
      - kms_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5175/"]
      interval: 30s
      timeout: 10s
      retries: 3

# ==============================================================================
# Volumes for persistent data
# ==============================================================================
volumes:
  redis_data:
    driver: local
  kms_django_static:
    driver: local
  kms_django_media:
    driver: local
  kms_django_logs:
    driver: local

# ==============================================================================
# Networks
# ==============================================================================
networks:
  kms_network:
    driver: bridge
