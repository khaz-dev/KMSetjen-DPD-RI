<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <!-- Background -->
  <rect width="400" height="300" fill="#f0f0f0"/>
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="articleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f0f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4e3f0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#articleGradient)"/>
  
  <!-- Document/Article icon -->
  <g transform="translate(150, 80)">
    <!-- Paper stack -->
    <rect x="0" y="0" width="100" height="140" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.5"/>
    <line x1="0" y1="25" x2="100" y2="25" stroke="#e0e0e0" stroke-width="1"/>
    <line x1="0" y1="50" x2="100" y2="50" stroke="#e0e0e0" stroke-width="1"/>
    <line x1="0" y1="75" x2="100" y2="75" stroke="#e0e0e0" stroke-width="1"/>
    <line x1="0" y1="100" x2="100" y2="100" stroke="#e0e0e0" stroke-width="1"/>
    <line x1="0" y1="125" x2="100" y2="125" stroke="#e0e0e0" stroke-width="1"/>
  </g>
  
  <!-- Text label -->
  <text x="200" y="250" font-size="16" font-weight="500" fill="#666666" text-anchor="middle" font-family="Arial, sans-serif">
    Article Image
  </text>
  <text x="200" y="275" font-size="12" fill="#999999" text-anchor="middle" font-family="Arial, sans-serif">
    No image available
  </text>
</svg>