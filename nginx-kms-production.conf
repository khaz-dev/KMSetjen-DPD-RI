# ============================================================================
# Nginx Configuration for KMSetjen DPD RI - Subdomain Routing
# ============================================================================
# File Location: /etc/nginx/sites-available/kmsetjendpdri-subdomains
# 
# MIGRATION FROM SUBPATH TO SUBDOMAIN ROUTING
# 
# OLD (khaz.app/kms + khaz.app/kms/api):
#   - Single domain with /kms subpath
#   - Complex nginx routing
#   - Inconsistent with production
#
# NEW (kms.khaz.app + kms-be.khaz.app):
#   - Separate subdomains for frontend and backend
#   - Simple, clean routing
#   - Identical architecture to production!
# 
# Setup Instructions:
# 1. Copy this file to /etc/nginx/sites-available/kmsetjendpdri-subdomains:
#    sudo cp nginx-kms-subdomains.conf /etc/nginx/sites-available/kmsetjendpdri-subdomains
#
# 2. Enable this config and disable old ones:
#    sudo rm -f /etc/nginx/sites-enabled/kmsetjendpdri
#    sudo rm -f /etc/nginx/sites-enabled/kmsetjendpdri-docker
#    sudo ln -s /etc/nginx/sites-available/kmsetjendpdri-subdomains /etc/nginx/sites-enabled/kmsetjendpdri-subdomains
#
# 3. Test nginx configuration:
#    sudo nginx -t
#
# 4. Reload nginx:
#    sudo systemctl reload nginx
#
# 5. Set DNS records (in your domain registrar):
#    Type    Name      Value              TTL
#    A       kms       165.245.191.216    3600
#    A       kms-be    165.245.191.216    3600
#
# ============================================================================

# ============================================================================
# HTTP → HTTPS Redirect (ALL DOMAINS)
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name kms.khaz.app kms-be.khaz.app www.khaz.app khaz.app;
    
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================================
# FRONTEND: kms.khaz.app
# ============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kms.khaz.app;
    
    # ========================================================================
    # SSL Configuration (certbot will manage these)
    # ========================================================================
    ssl_certificate /etc/letsencrypt/live/khaz.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khaz.app/privkey.pem;
    
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # ========================================================================
    # Security Headers
    # ========================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    
    # ========================================================================
    # Proxy to Frontend (React SPA on port 5175)
    # ========================================================================
    location / {
        proxy_pass http://127.0.0.1:5175/;
        
        # Pass headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # WebSocket support (if needed in future)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # SPA caching
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header Vary "Accept-Encoding";
    }
    
    # ========================================================================
    # Static Assets (long cache)
    # ========================================================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:5175;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # ========================================================================
    # Favicon Handling
    # ========================================================================
    location = /favicon.ico {
        proxy_pass http://127.0.0.1:5175/favicon.ico;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }
    
    location = /favicon.svg {
        proxy_pass http://127.0.0.1:5175/favicon.svg;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }
    
    # ========================================================================
    # Access and Error Logs
    # ========================================================================
    access_log /var/log/nginx/kms-frontend-access.log;
    error_log /var/log/nginx/kms-frontend-error.log warn;
}

# ============================================================================
# BACKEND: kms-be.khaz.app
# ============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kms-be.khaz.app;
    
    # ========================================================================
    # SSL Configuration (certbot will manage these)
    # ========================================================================
    ssl_certificate /etc/letsencrypt/live/khaz.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khaz.app/privkey.pem;
    
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # ========================================================================
    # Security Headers
    # ========================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    
    # ========================================================================
    # Redirection to Admin Login for Root URL
    # ========================================================================
    location = / {
        return 301 /admin/login/?next=/admin/;
    }

    # ========================================================================
    # Favicon Handling (proxied to frontend service for consistency)
    # ========================================================================
    location = /favicon.ico {
        proxy_pass http://127.0.0.1:5175/favicon.ico;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }
    
    location = /favicon.svg {
        proxy_pass http://127.0.0.1:5175/favicon.svg;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # ========================================================================
    # Proxy to Backend (Django on port 8002)
    # ========================================================================
    location / {
        proxy_pass http://127.0.0.1:8002/;
        
        # Pass headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # Important: DO NOT set X-Script-Name because we're not using subpath routing anymore!
        # The backend is now accessed directly by domain name, not by subpath.
        
        # Timeouts (longer for API requests)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Handle large uploads
        client_max_body_size 100M;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
    
    # ========================================================================
    # Media Files (User-uploaded content like avatars)
    # ========================================================================
    location /media/ {
        alias /var/lib/docker/volumes/kms_kms_django_media/_data/;
        
        # Allow caching of media files
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        
        # CORS Headers - Allow Office Online and other services to access media files
        # Office Online Viewer (officeapps.live.com) needs CORS to fetch PPTX files
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, Range" always;
        add_header Access-Control-Max-Age "86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        
        # Handle OPTIONS preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, Range" always;
            add_header Access-Control-Max-Age "86400" always;
            add_header Content-Length 0 always;
            return 204;
        }
        
        access_log off;
    }
    
    # ========================================================================
    # Static Files (CSS, JS, from Django collectstatic)
    # ========================================================================
    location /static/ {
        alias /var/lib/docker/volumes/kms_kms_django_static/_data/;
        
        # Long cache for static assets
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }
    
    # ========================================================================
    # Health Check Endpoint (for monitoring)
    # ========================================================================
    location /health/ {
        proxy_pass http://127.0.0.1:8002/health/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        access_log off;
    }
    
    # ========================================================================
    # Access and Error Logs
    # ========================================================================
    access_log /var/log/nginx/kms-backend-access.log;
    error_log /var/log/nginx/kms-backend-error.log warn;
}

# ============================================================================
# Redirect www.khaz.app to kms.khaz.app
# ============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.khaz.app;
    
    ssl_certificate /etc/letsencrypt/live/khaz.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khaz.app/privkey.pem;
    
    return 301 https://kms.khaz.app$request_uri;
}

# ============================================================================
# Redirect khaz.app root to kms.khaz.app
# ============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name khaz.app;
    
    ssl_certificate /etc/letsencrypt/live/khaz.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khaz.app/privkey.pem;
    
    return 301 https://kms.khaz.app$request_uri;
}
