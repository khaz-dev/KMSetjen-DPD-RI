# ============================================================================
# Nginx Configuration for KMSetjen DPD RI - Production Server
# ============================================================================
# Domains:
#   - Frontend : https://kms.dpd.go.id (proxied to 127.0.0.1:5175)
#   - Backend  : https://kms-be.dpd.go.id (proxied to 127.0.0.1:8002)
#
# Deployment target: /etc/nginx/sites-available/kms-production
# Symlink: /etc/nginx/sites-enabled/kms-production
# ============================================================================

# ============================================================================
# HTTP -> HTTPS Redirect
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name kms.dpd.go.id www.kms.dpd.go.id kms-be.dpd.go.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================================
# FRONTEND: kms.dpd.go.id
# ============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kms.dpd.go.id www.kms.dpd.go.id;

    # SSL Certificates (update path if using government internal CA or Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/kms.dpd.go.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kms.dpd.go.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json application/javascript image/svg+xml;

    # Proxy to Frontend Container (Vite SPA on port 5175)
    location / {
        proxy_pass http://127.0.0.1:5175/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Static Assets Caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:5175;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Access & Error Logs
    access_log /var/log/nginx/kms-frontend-access.log;
    error_log /var/log/nginx/kms-frontend-error.log warn;
}

# ============================================================================
# BACKEND: kms-be.dpd.go.id
# ============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kms-be.dpd.go.id;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/kms.dpd.go.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kms.dpd.go.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Client upload size limit
    client_max_body_size 100M;

    # Redirect root to admin login
    location = / {
        return 301 /admin/login/?next=/admin/;
    }

    # Health Check
    location /health/ {
        proxy_pass http://127.0.0.1:8002/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Proxy to Backend API (Django/Gunicorn on port 8002)
    location / {
        proxy_pass http://127.0.0.1:8002/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Media Files (uploaded documents, images)
    location /media/ {
        alias /var/lib/docker/volumes/kms_media_files/_data/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;

        # CORS for PPTX viewer and PDF preview
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, Range" always;
        add_header Access-Control-Max-Age "86400" always;
        add_header X-Content-Type-Options "nosniff" always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, Range" always;
            add_header Access-Control-Max-Age "86400" always;
            add_header Content-Length 0 always;
            return 204;
        }

        access_log off;
    }

    # Static Files (collected Django admin static)
    location /static/ {
        alias /var/lib/docker/volumes/kms_static_files/_data/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # Access & Error Logs
    access_log /var/log/nginx/kms-backend-access.log;
    error_log /var/log/nginx/kms-backend-error.log warn;
}
