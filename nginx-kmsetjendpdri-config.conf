# ============================================================================
# Nginx Configuration for KMSetjen DPD RI at Subpath /kmsetjendpdri
# ============================================================================
# File Location: /etc/nginx/sites-available/kmsetjendpdri
# 
# After creating this file:
# 1. Enable: sudo ln -s /etc/nginx/sites-available/kmsetjendpdri /etc/nginx/sites-enabled/kmsetjendpdri
# 2. Disable default: sudo rm -f /etc/nginx/sites-enabled/default
# 3. Test: sudo nginx -t
# 4. Restart: sudo systemctl restart nginx
# ============================================================================

# HTTP redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name khaz.app www.khaz.app;
    
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name khaz.app www.khaz.app;
    
    # SSL Configuration (certbot will update these)
    ssl_certificate /etc/letsencrypt/live/khaz.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khaz.app/privkey.pem;
    
    # SSL Security Headers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Root - serve static files and other root content
    # Redirect root to the app subpath
    location = / {
        return 301 $scheme://$server_name/kmsetjendpdri/;
    }
    
    # ========================================================================
    # KMSETJENDPDRI APPLICATION AT SUBPATH
    # ========================================================================
    
    # Root application path - serve React SPA
    location /kmsetjendpdri/ {
        # Try to serve files, if not found serve index.html (SPA routing)
        root /var/www/html;
        try_files /kmsetjendpdri/dist/$uri /kmsetjendpdri/dist/index.html;
        
        # Cache headers for SPA
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
    
    # React asset files - long cache duration
    location /kmsetjendpdri/dist/ {
        root /var/www/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Static files (CSS, JS, images from Django collectstatic)
    location /kmsetjendpdri/static/ {
        root /var/www/html/kmsetjendpdri/backend;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Media files (user uploads)
    location /kmsetjendpdri/media/ {
        root /var/www/html/kmsetjendpdri/backend;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
    
    # Django Admin Interface
    location /kmsetjendpdri/admin/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /kmsetjendpdri;
        
        # Allow larger uploads/forms
        client_max_body_size 100M;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }
    
    # API Endpoints - Django REST Framework
    location /kmsetjendpdri/api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /kmsetjendpdri;
        
        # Handle file uploads
        client_max_body_size 100M;
        
        # WebSocket support (if needed for real-time features)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts for long-running requests
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }
    
    # ========================================================================
    # OTHER ROOT-LEVEL LOCATIONS
    # ========================================================================
    
    # Favicon and robots
    location ~ ^/(favicon.ico|robots.txt)$ {
        access_log off;
        log_not_found off;
    }
    
    # Disable access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to .env and other sensitive files
    location ~ \.(env|git|gitignore|env\.example)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # ========================================================================
    # LOGGING
    # ========================================================================
    access_log /var/log/nginx/kmsetjendpdri_access.log;
    error_log /var/log/nginx/kmsetjendpdri_error.log warn;
}
