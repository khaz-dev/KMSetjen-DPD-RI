# ============================================================================
# Nginx Configuration for KMSetjen DPD RI - Docker Deployment
# ============================================================================
# File Location: /etc/nginx/sites-available/kmsetjendpdri
# 
# Setup:
# 1. sudo cp nginx-kmsetjendpdri-config-docker.conf /etc/nginx/sites-available/kmsetjendpdri
# 2. sudo ln -s /etc/nginx/sites-available/kmsetjendpdri /etc/nginx/sites-enabled/kmsetjendpdri
# 3. sudo rm -f /etc/nginx/sites-enabled/default
# 4. sudo nginx -t
# 5. sudo systemctl restart nginx
# ============================================================================

# HTTP redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name khaz.app www.khaz.app;
    
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name khaz.app www.khaz.app;
    
    # SSL Configuration (certbot will update these)
    ssl_certificate /etc/letsencrypt/live/khaz.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khaz.app/privkey.pem;
    
    # SSL Security Headers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Root - redirect to app
    location = / {
        return 301 $scheme://$server_name/kmsetjendpdri/;
    }
    
    # ========================================================================
    # FAVICON SERVING - Handle favicon requests from root domain
    # ========================================================================
    # Serve favicon.ico and favicon.svg from frontend container for root domain requests
    # This prevents 404 errors when Django admin or other apps request favicon from root
    
    location = /favicon.ico {
        proxy_pass http://127.0.0.1:5175/favicon.ico;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }
    
    location = /favicon.svg {
        proxy_pass http://127.0.0.1:5175/favicon.svg;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }
    
    # ========================================================================
    # KMSETJENDPDRI APPLICATION AT SUBPATH - DOCKER VERSION
    # ========================================================================
    # All requests to /kmsetjendpdri/ are either:
    # 1. Static files from the frontend (served by frontend container)
    # 2. API requests (proxied to Django container)
    
    # Root application path - proxy to frontend React SPA
    location /kmsetjendpdri/ {
        # First, try static files from frontend container
        # Then fall back to frontend container for SPA routing
        proxy_pass http://127.0.0.1:5175/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Script-Name /kmsetjendpdri;
        
        # Cache headers for SPA
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header Vary "Accept-Encoding";
    }
    
    # API Endpoints - proxy to Django
    location /kmsetjendpdri/api/ {
        proxy_pass http://127.0.0.1:8002/api/;
        
        proxy_set_header Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Script-Name /kmsetjendpdri;
        
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
        
        # Disable buffering for streaming responses
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Cache settings
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
    }
    
    # Django Admin Interface
    location /kmsetjendpdri/admin/ {
        proxy_pass http://127.0.0.1:8002/admin/;
        
        proxy_set_header Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Script-Name /kmsetjendpdri;
        
        proxy_read_timeout 120s;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }
    
    # Static files from Django (CSS, JS after collectstatic)
    location /kmsetjendpdri/static/ {
        proxy_pass http://127.0.0.1:8002/static/;
        
        proxy_set_header Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;  
    }
    
    # Media files (user uploads)
    location /kmsetjendpdri/media/ {
        proxy_pass http://127.0.0.1:8002/media/;
        
        proxy_set_header Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        expires 30d;
        add_header Cache-Control "public, max-age=2592000"  always;
    }
    
    # Health check endpoint
    location /kmsetjendpdri/health/ {
        proxy_pass http://127.0.0.1:8002/health/;
        access_log off;
        expires -1;
    }
    
    # Catch-all error pages
    error_page 404 /kmsetjendpdri/404.html;
    error_page 500 502 503 504 /kmsetjendpdri/50x.html;
}
